# Version updates wait 7 days after a release is published (cooldown): a compromised release is
# usually found and pulled within days, and a version that old has had that time. Security updates
# are not delayed by it.
# Every update targets develop, like any other change: it reaches main with the next develop -> main
# pull request (docs/deploy.md, "Fluxo de branches"). Security updates ignore target-branch and open
# against main: retarget them to develop (gh pr edit <n> --base develop) before merging.
version: 2
updates:
  - package-ecosystem: gradle
    target-branch: develop
    directory: /apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      spring:
        patterns:
          - "org.springframework*"
      all-others:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"
  - package-ecosystem: npm
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The types describe the Node.js the images and CI run (.node-version): their major moves with
      # the runtime, by hand, never ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      all-others:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    target-branch: develop
    directories:
      - /apps/api
      - /apps/web
      - /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
