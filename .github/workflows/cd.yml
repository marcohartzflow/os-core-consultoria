# Continuous deployment of a client instance: every push to main goes to production, after the CI
# jobs pass (they run here, through workflow_call, so a red test never reaches the server).
# os-core itself has nothing to deploy: without the repository variable DEPLOY_HOST only the CI runs.
#
# Images are built here and pushed to the fork's GitHub Container Registry, tagged with the commit
# SHA. The server never builds: it pulls the two images and restarts (deploy/update.sh).
#
# Rolling back: Actions > CD > Run workflow, with the commit SHA of an earlier deploy of main. The
# images of that commit are already in the registry, so nothing is tested or built again.
#
# Fork setup (docs/deploy.md, "Deploy contínuo"): Settings > Secrets and variables > Actions
#   variables: DEPLOY_HOST      host name or IP of the server
#              DEPLOY_HOST_KEY  the server's SSH host public key, one line as printed by
#                               `ssh-keyscan -t ed25519 <host>` (pins the host: no trust-on-first-use)
#              DEPLOY_USER      SSH user of the deploy (default "deploy")
#              DEPLOY_URL       public address of the portal (https://<OS_DOMAIN>), checked after
#                               each deploy at /api/health
#   secrets:   DEPLOY_SSH_KEY   private key whose public half the server accepts only for
#                               deploy/ci-deploy.sh (authorized_keys forced command, set up by the
#                               Ansible playbook): the key cannot open a shell on the server.
# Repository secrets and variables, not an environment's: on GitHub Free a private repository has
# no environment secrets nor deployment protection rules, so an environment would protect nothing.
name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA of main to deploy again (rollback). Empty builds and deploys the head of main.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}

jobs:
  ci:
    name: CI
    if: inputs.sha == ''
    uses: ./.github/workflows/ci.yml
    with:
      skip-images: true

  images:
    name: Build and push images
    needs: ci
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/os-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/os-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # Same gate as the CI's image job (which this workflow skips): a critical vulnerability with a
      # fix stops the deploy. The images are already in the registry, but nothing runs them.
      - name: API image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REPOSITORY }}/os-api:${{ github.sha }}
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Web image vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REPOSITORY }}/os-web:${{ github.sha }}
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  deploy:
    name: Deploy to server
    needs: images
    # A rollback skips the CI and the images (both already passed for that commit); a push deploys
    # only what they built. Only main is deployed; the server checks the commit is on main as well.
    if: >-
      !cancelled() && vars.DEPLOY_HOST != '' && github.ref == 'refs/heads/main'
      && (needs.images.result == 'success' || (inputs.sha != '' && needs.images.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Commit to deploy
        id: target
        env:
          REQUESTED: ${{ inputs.sha }}
        run: |
          sha="${REQUESTED:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Give the full 40-character commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Install SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_HOST_KEY" || { echo "Set the repository variable DEPLOY_HOST_KEY (ssh-keyscan -t ed25519 <host>)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Update the instance
        # The server runs deploy/ci-deploy.sh whatever command is sent (forced command); it reads the
        # registry login from stdin and keeps it in a temporary Docker config deleted on exit.
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" \
            | ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_TARGET" "deploy $SHA"
      # The server already waited for every container to be healthy (update.sh, `up --wait`); this
      # checks the portal from outside, through DNS, TLS, Caddy, the Next server, the API and its
      # database. A failure turns the run red, and GitHub notifies whoever triggered it.
      - name: The portal answers
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          test -n "$DEPLOY_URL" || { echo "Set the repository variable DEPLOY_URL (https://<OS_DOMAIN>)"; exit 1; }
          curl -fsS --max-time 10 --retry 10 --retry-delay 6 --retry-all-errors "$DEPLOY_URL/api/health" | grep -q '"UP"'
