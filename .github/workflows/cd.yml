# Continuous deployment of a client instance. os-core itself has nothing to deploy: this workflow
# only runs in a fork where the repository variable DEPLOY_HOST is set.
#
# Images are built here and pushed to the fork's GitHub Container Registry, tagged with the commit
# SHA. The server never builds: it pulls the two images and restarts (deploy/update.sh). Rolling
# back is running the same script with the previous SHA.
#
# Fork setup: Settings > Secrets and variables > Actions
#   variables: DEPLOY_HOST      host name or IP of the server
#              DEPLOY_HOST_KEY  the server's SSH host public key, one line as printed by
#                               `ssh-keyscan -t ed25519 <host>` (pins the host: no trust-on-first-use)
#              DEPLOY_USER      SSH user allowed to run docker (default "deploy")
#              DEPLOY_PATH      checkout of the fork on the server (default "/opt/os")
#   secrets:   DEPLOY_SSH_KEY   private key of DEPLOY_USER
# The server must be able to pull from the fork's registry: the workflow logs Docker in with the
# job's GITHUB_TOKEN over the SSH session, so no long-lived registry credential lives on the host.
name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: Build and push images
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/os-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/os-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_HOST_KEY" || { echo "Set the repository variable DEPLOY_HOST_KEY (ssh-keyscan -t ed25519 <host>)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Update the instance
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_USER || 'deploy' }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/os' }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -o StrictHostKeyChecking=yes "$DEPLOY_TARGET" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin \
             && cd '$DEPLOY_PATH' && git fetch --prune && git checkout --force '$IMAGE_TAG' \
             && OS_IMAGE_REPOSITORY='$IMAGE_REPOSITORY' deploy/update.sh '$IMAGE_TAG' \
             && docker logout ghcr.io"
