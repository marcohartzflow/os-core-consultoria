# Reference deployment of one OS instance on a single host: Postgres, API, web and Caddy (TLS).
# Copy .env.example to .env, fill it in, then: docker compose up -d --build
name: os

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: os
      POSTGRES_USER: os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os -d os"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/os
      SPRING_DATASOURCE_USERNAME: os
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      OS_APP_BASE_URL: https://${OS_DOMAIN:?set OS_DOMAIN in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      OS_MFA_ENCRYPTION_KEY: ${OS_MFA_ENCRYPTION_KEY:?set OS_MFA_ENCRYPTION_KEY in .env}
      OS_BOOTSTRAP_ADMIN_EMAIL: ${OS_BOOTSTRAP_ADMIN_EMAIL:-}
      OS_BOOTSTRAP_ADMIN_PASSWORD: ${OS_BOOTSTRAP_ADMIN_PASSWORD:-}
      OS_BOOTSTRAP_ADMIN_NAME: ${OS_BOOTSTRAP_ADMIN_NAME:-Administrador}
      OS_MAIL_FROM: ${OS_MAIL_FROM:-}
      OS_MAIL_PORTAL_NAME: ${OS_MAIL_PORTAL_NAME:-OS}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    healthcheck:
      # The JRE image has no curl; bash can open the TCP socket and read the health status.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OS_DOMAIN: ${OS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
