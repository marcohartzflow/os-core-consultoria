# Reference deployment of one OS instance on a single host: Postgres, API, web and Caddy (TLS).
# Copy .env.example to .env and fill it in, run deploy/init-secrets.sh and put the Anthropic key in
# secrets/anthropic_api_key, then: deploy/update.sh <tag> (images from the registry) or
# deploy/update.sh (build here). Image names come from OS_IMAGE_REPOSITORY and OS_IMAGE_TAG.
#
# Images are pinned by digest (Dependabot proposes updates). Secrets are files mounted under
# /run/secrets, never environment variables: they do not show in `docker inspect`, in the
# process environment or in anything a crash report captures. The API reads them as Spring
# properties through a config tree (application-prod.yml): each file is named after its property.
#
# Every service drops all capabilities, cannot gain privileges, and has memory and process limits;
# api and web run as their image's non-root user on a read-only filesystem. Only Caddy publishes ports.
name: os

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    <<: *hardened
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    # The entrypoint starts as root to fix volume ownership, then drops to the postgres user.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: os
      POSTGRES_USER: os
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /run/postgresql
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U os -d os"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    <<: *hardened
    image: ${OS_IMAGE_REPOSITORY:-os}/os-api:${OS_IMAGE_TAG:-latest}
    build:
      context: ../apps/api
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/os
      SPRING_DATASOURCE_USERNAME: os
      OS_APP_BASE_URL: https://${OS_DOMAIN:?set OS_DOMAIN in .env}
      # First start only (the account must choose a new password at first login); remove afterwards.
      OS_BOOTSTRAP_ADMIN_EMAIL: ${OS_BOOTSTRAP_ADMIN_EMAIL:-}
      OS_BOOTSTRAP_ADMIN_PASSWORD: ${OS_BOOTSTRAP_ADMIN_PASSWORD:-}
      OS_BOOTSTRAP_ADMIN_NAME: ${OS_BOOTSTRAP_ADMIN_NAME:-Administrador}
      OS_MAIL_FROM: ${OS_MAIL_FROM:-}
      OS_MAIL_PORTAL_NAME: ${OS_MAIL_PORTAL_NAME:-OS}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
    secrets:
      - source: db_password
        target: spring.datasource.password
      - source: anthropic_api_key
        target: spring.ai.anthropic.api-key
      - source: mfa_encryption_key
        target: os.iam.mfa.encryption-key
      - source: mail_password
        target: spring.mail.password
      # The JVM sizes its heap from this limit, not from the host (MaxRAMPercentage in the image).
    deploy:
      resources:
        limits:
          memory: 1536m
          pids: 512
    healthcheck:
      # The JRE image has no curl; bash can open the TCP socket and read the health status.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    <<: *hardened
    image: ${OS_IMAGE_REPOSITORY:-os}/os-web:${OS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    <<: *hardened
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OS_DOMAIN: ${OS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 512
    depends_on:
      web:
        condition: service_healthy

secrets:
  db_password:
    file: ./secrets/db_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  mfa_encryption_key:
    file: ./secrets/mfa_encryption_key
  mail_password:
    file: ./secrets/mail_password

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
