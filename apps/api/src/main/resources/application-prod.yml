server:
  # TLS terminates at the client's reverse proxy. Tomcat's RemoteIpValve trusts X-Forwarded-* only
  # from internal (RFC 1918 / loopback) proxies, so a request that reaches Tomcat directly cannot
  # spoof its scheme, host or client IP. Bind the app to a private interface or firewall port 8080.
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: false

os:
  app:
    # No default in production: links in e-mails must never point at localhost. Startup fails without it.
    base-url: ${OS_APP_BASE_URL}

logging:
  level:
    # Invitation and reset links must never reach shipped logs; in prod MailAccountNotifier is active.
    com.maximusflow.os.iam.internal.application.LoggingAccountNotifier: WARN
