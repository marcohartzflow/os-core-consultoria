server:
  # TLS terminates at the client's reverse proxy. Tomcat's RemoteIpValve trusts X-Forwarded-* only
  # from internal (RFC 1918 / loopback) proxies, so a request that reaches Tomcat directly cannot
  # spoof its scheme, host or client IP. Bind the app to a private interface or firewall port 8080.
  forward-headers-strategy: native

springdoc:
  api-docs:
    enabled: false

spring:
  mail:
    # SMTP of the client. With host set, MailAccountNotifier sends invitations and resets; OS_MAIL_FROM is required.
    host: ${OS_SMTP_HOST}
    port: ${OS_SMTP_PORT:587}
    username: ${OS_SMTP_USERNAME:}
    password: ${OS_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

logging:
  level:
    # Invitation and reset links must never reach shipped logs; in prod MailAccountNotifier is active.
    com.maximusflow.os.iam.internal.application.LoggingAccountNotifier: WARN
