spring:
  ai:
    anthropic:
      api-key: test-key
os:
  auth:
    session:
      cookie-secure: false
    rate-limit:
      # The flow tests fire many requests from one address; the limiter itself has a unit test.
      login-per-minute: 1000
      recovery-per-minute: 1000
  iam:
    password:
      check-compromised: false
    bootstrap:
      admin-email: admin@example.com
      admin-password: Admin-Password-2026
      admin-name: Admin
      require-password-change: false
    mfa:
      # Flow tests use the bootstrap administrator without a second factor; MfaTests turn the policy on.
      require-for-system-role: false
      encryption-key: dGVzdC1rZXktdGVzdC1rZXktdGVzdC1rZXktdGVzdCE=
logging:
  level:
    SECURITY: INFO
